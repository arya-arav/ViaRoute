name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: viaroute, POSTGRES_PASSWORD: viaroute, POSTGRES_DB: viaroute }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U viaroute" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://viaroute:viaroute@localhost:5432/viaroute?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @viaroute/db build
      - run: pnpm --filter @viaroute/api exec tsc --noEmit -p tsconfig.json
      - run: pnpm --filter @viaroute/api test

  web:
    name: Web lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @viaroute/web lint
      - run: pnpm --filter @viaroute/web build

  cloudflare:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @viaroute/cloudflare typecheck
      - run: pnpm --filter @viaroute/cloudflare test

  images:
    name: Build & push images
    needs: [test, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/viaroute-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/viaroute-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.ROOT_DOMAIN }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.ROOT_DOMAIN }}
          tags: ghcr.io/${{ github.repository_owner }}/viaroute-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/viaroute-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Deploys stay off until the server exists: set the repository variable DEPLOY_ENABLED=true
  # (Settings → Secrets and variables → Actions → Variables) after adding the SSH secrets.
  deploy-staging:
    name: Deploy to staging
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/viaroute
            export TAG=${{ github.sha }} REGISTRY=ghcr.io/${{ github.repository_owner }}
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production pull api web
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
            docker image prune -f

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment in GitHub → manual approval step.
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/viaroute
            export TAG=${{ github.sha }} REGISTRY=ghcr.io/${{ github.repository_owner }}
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production pull api web
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
            docker image prune -f
